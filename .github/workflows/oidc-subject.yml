name: Show AWS login subject

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  show-subject:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show the subject for this repository and main branch
        run: python3 scripts/oidc_subject.py
